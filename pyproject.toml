[project]
name = "secunda-test"
version = "0.1.0"
description = "Asynchronous payment processing with transactional outbox and durable webhooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "faststream[rabbit]>=0.7.7",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL and RabbitMQ"]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "G", "LOG"]
extend-select = ["W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/helpers.py" = ["ASYNC109", "ASYNC110"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faststream.*", "asyncpg.*"]
follow_imports = "skip"
ignore_missing_imports = true
